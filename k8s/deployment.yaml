apiVersion: apps/v1
kind: Deployment

metadata:

  name: justdefenders-platform

spec:

  replicas: 2

  selector:

    matchLabels:

      app: justdefenders

  template:

    metadata:

      labels:

        app: justdefenders

    spec:

      containers:

      - name: justdefenders

        image: justdefenders:latest

        ports:

        - containerPort: 8081